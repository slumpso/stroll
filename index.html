<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<title>Meadow Drift</title>
<style>
/* Full-screen scene with a floating glass control bar; one deliberate dark look over the meadow. */
:root{--bg:#0d140a;--fg:#fff;--dim:rgba(255,255,255,.6);--panel:rgba(8,8,8,.58);--edge:rgba(255,255,255,.13);--chip:rgba(255,255,255,.06);--chip-hi:rgba(255,255,255,.14);--accent:#fff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(0,0,0,.32) 100%)}
#hud{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.6);transition:opacity .6s}
#hud{display:none} /* title and track info hidden for release; the bar's status line still names the song */
#hud h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em}
#hud p{margin:3px 0 0;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
/* the big start button: a bare play glyph with a drop shadow, no box */
#hint{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);padding:16px 24px;font-size:64px;line-height:1;color:#fff;cursor:pointer;user-select:none;-webkit-user-select:none;text-shadow:0 0 28px rgba(0,0,0,.95),0 6px 30px rgba(0,0,0,.9),0 2px 6px rgba(0,0,0,.95);filter:drop-shadow(0 0 16px rgba(0,0,0,.7));opacity:.95;transition:opacity .5s}
#hint:hover{opacity:1}
#hint.gone{opacity:0;pointer-events:none}
#drop{position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:20px;display:grid;place-items:center;font-size:18px;background:rgba(10,14,8,.55);opacity:0;pointer-events:none;transition:opacity .2s}
#drop.on{opacity:1}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(780px,calc(100% - 24px));padding:4px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;transition:opacity .6s;text-shadow:0 1px 8px rgba(0,0,0,.75)}
#bar.hide,#hud.hide{opacity:0}
button,label.btn,select{font:inherit;font-size:13px;color:var(--fg);background:var(--chip);border:1px solid var(--edge);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
button:hover,label.btn:hover{background:var(--chip-hi)}
/* the main bar is bare: white text and icons straight over the scene, no boxes */
#bar button,#bar label.btn{background:none;border:0;padding:6px 8px;opacity:.82}
#bar button:hover,#bar label.btn:hover{background:none;opacity:1}
#bar label.tog{opacity:.4}
#bar label.tog:has(input:checked){opacity:.95}
button:disabled{opacity:.45;cursor:wait}
button:focus-visible,label.btn:focus-within,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.btn input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
#play{min-width:46px;font-size:15px}
.seek{display:flex;align-items:center;gap:8px;flex:1 1 200px;min-width:0;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.seek input{flex:1;min-width:0}
input[type=range]{accent-color:var(--accent)}
#vol{width:80px}
.foot{flex:1 1 100%;display:flex;gap:16px;align-items:baseline;min-width:0}
#tag{flex:none;font-size:12px;color:var(--dim);letter-spacing:.02em}
#status{flex:1 1 auto;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#panel{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(128px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 28px));max-height:calc(100% - 160px);overflow:auto;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--edge);border-radius:16px;padding:12px 14px;flex-direction:column;gap:10px;display:flex}
#panel[hidden]{display:none} /* the rule above sets display:flex, which would otherwise override the hidden attribute */
#panel h2{margin:0;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12px}
.sl input{grid-column:1/-1;width:100%}
.sl b{font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px}
.row label{display:flex;align-items:center;gap:6px}
@media (prefers-reduced-motion:reduce){#bar,#hud,#hint{transition:none}}
/* first-launch loading veil: swaying grass with a soft glow, like the other visualizers */
#veil{position:fixed;inset:0;z-index:50;background:#010204;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity 1.4s ease;user-select:none}
#veil.gone{opacity:0;pointer-events:none}
#veil svg{width:104px;height:86px;fill:#d6eccb;overflow:visible;animation:breathe 3.4s ease-in-out infinite alternate}
#veil .bl{transform-box:fill-box;transform-origin:50% 100%;animation:sway var(--d) ease-in-out var(--o) infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes breathe{from{filter:drop-shadow(0 0 8px rgba(170,235,165,.28))}to{filter:drop-shadow(0 0 24px rgba(170,235,165,.62))}}
#vtxt{font-size:13px;letter-spacing:.38em;padding-left:.38em;text-transform:uppercase;color:#9fb092}
#vsub{font-size:11px;letter-spacing:.2em;color:#56634f;min-height:1.2em;font-variant-numeric:tabular-nums}
#vbar{width:min(220px,62vw);height:2px;background:#1a2418;border-radius:2px;overflow:hidden}
#vbar i{display:block;height:100%;width:0;background:#9fb092;transition:width .3s ease}
@media (prefers-reduced-motion:reduce){#veil .bl,#veil svg{animation:none}}
</style>

</div>

   as the song ends (and becomes the starting arch on the next play). It straddles the trail, square to its direction,
   on levelled ground, with taller grass around both feet. */
const ARCH={gap:9,scale:1,foot:3.44,placed:{}};
const archZ=T=>-(camDist+(T-songTime())*speedMS()+.62*lookAhead())-ARCH.gap;
const archTimes=()=>song?[0,song.an.dur]:[];
const archYaw=z=>Math.atan(pathX(z+.5)-pathX(z-.5));
function archFeet(z){const xc=pathX(z),a=archYaw(z),c=Math.cos(a),s=Math.sin(a),f=ARCH.foot;return [[xc-c*f,z+s*f],[xc+c*f,z-s*f]]}
function archRes(x,z,r){for(const T of archTimes()){const za=archZ(T);if(Math.abs(z-za)>3.2)continue;for(const [fx,fz] of archFeet(za))if((x-fx)**2+(z-fz)**2<(1.5+r)**2)return true}return false}
function updateArches(){if(!PROPS.arch||!PROPS.arch[0]||!song)return;const lim=spawnAhead(),A=PROPS.arch[0];
  // an arch belongs only where the song starts or ends; any other one still ahead of the camera is a stray, so drop it
  // (and let a start/end arch that no longer matches its spot be placed again)
  const fits=z=>archTimes().some(T=>Math.abs(z-archZ(T))<2);let drop=false;
  for(const r of A.live)if(r&&r.z<-camDist-1&&!fits(r.z)){r.z=Infinity;drop=true}
  if(drop){A.cull(-camDist+U.uPatch.value.z+3);for(const T of archTimes())if(!A.live.some(r=>r&&Math.abs(r.z-archZ(T))<2))ARCH.placed[T]=false}
  for(const T of archTimes()){if(ARCH.placed[T])continue;const za=archZ(T),d=-za-camDist;if(d>lim||d<-HM.back)continue;
    ARCH.placed[T]=true;PROPS.arch[0].spawn(pathX(za),za,archYaw(za),ARCH.scale,[0,0]);
    for(const [fx,fz] of archFeet(za))occAdd(fx,fz,1.3,1)}}

/* ---------------- the song's prop schedule ---------------- */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let sched=[],sPtr=0,graves=[];
function buildSchedule(dur){
  const R=mulberry(Math.round(dur*1000)+7);sched=[];
  for(const k of ['pebble','stone','medrock','wood','skull']){const d=PROP_DEFS[k];let t=R()*4/d.rate;
    while(t<dur){sched.push({t,k,m:R()*d.files.length|0,x:(R()*2-1)*8.5,r:[R(),R(),R(),R(),R()]});t+=-Math.log(1-R()*.999)/d.rate}}
  {const d=PROP_DEFS.tree;let t=R()*12;while(t<dur){sched.push({t,k:'tree',m:0,side:R()<.5?-1:1,r:[R(),R(),R(),R(),R()]});t+=12-Math.log(1-R()*.999)/d.rate}}
  for(const f of [.34,.66])sched.push({t:(f+(R()-.5)*.1)*dur,k:'log',m:0,side:R()<.5?-1:1,r:[R(),R(),R(),R(),R()]});
  const gt=[.12,.31,.5,.69,.88].map(f=>f*dur+(R()-.5)*.05*dur),order=[0,1,2].sort(()=>R()-.5);
  graves=gt.map((t,i)=>({t,k:'grave',m:order[i%3],side:R()<.5?-1:1,off:R()*1.3,yaw:(R()-.5)*.42,r:[R(),R(),R(),R(),R()]}));
  // roaches run past three times a song, centipedes cross twice, fireflies drift over in three swarms
  ARCH.placed={};
  CRIT.roach.forEach((c,i)=>{c.t0=((i+.3+R()*.5)/3)*dur;c.D=5;c.v=8;c.side=R()<.5?1:-1;c.z=null});
  CRIT.centi.forEach((c,i)=>{c.t0=((i+.2+R()*.5)/2)*dur;c.D=14;c.dir=R()<.5?1:-1;c.z=null});
  CRIT.flies.forEach((c,i)=>{c.t0=((i+.2+R()*.5)/3)*dur;c.D=12;c.z=null});
  sched.push(...graves);sched.sort((a,b)=>a.t-b.t);sPtr=0;
}
// never spawn beyond the terrain that has been written yet, or props land on stale rows and float later
const spawnAhead=()=>Math.min(visFar()+4,HM.ahead-2);
const itemZ=it=>-(camDist+lookAhead()+(it.t-songTime())*speedMS());
function spawnItem(it){
  const d=PROP_DEFS[it.k],z=itemZ(it),r=it.r,M=PROPS[it.k][it.m];if(!M)return;
  if(it.k==='grave'){const gs=d.scale[0],gx=graveX(it,z);M.spawn(gx,z,it.yaw,gs,[(r[0]-.5)*.06,(r[1]-.5)*.06]);OBST.push({x:gx,z,r:.8*gs});return}
  const n=d.cluster?d.cluster[0]+Math.floor(r[0]*(d.cluster[1]-d.cluster[0]+1)):1;
  const sc0=lerp(d.scale[0],d.scale[1],r[2]),R0=d.edge?d.rad*sc0:Math.max(M.size[0],M.size[2])*.5*sc0;
  const edgeX=(side,f)=>pathV(z)+side*(pathHW(z)+d.edge[0]+f*(d.edge[1]-d.edge[0])+R0);
  let cx=d.edge?edgeX(it.side,r[3]):it.x;
  for(let k=0;k<8&&blocked(cx,z,R0);k++)cx=d.edge?edgeX(k&1?-it.side:it.side,Math.random()):(Math.random()*2-1)*8.5;
  if(blocked(cx,z,R0))return;
  const tl=()=>[(Math.random()*2-1)*(d.tilt||0),(Math.random()*2-1)*(d.tilt||0)];
  for(let j=0;j<n;j++){const a=r[1]*6.283+j*2.4,rr=j?.14+.24*Math.random():0,x=cx+Math.cos(a)*rr,zz=z+Math.sin(a)*rr;
    const sc=j?lerp(d.scale[0],d.scale[1],Math.random()):sc0,mm=n>1?PROPS[it.k][Math.random()*d.files.length|0]||M:M,rad=Math.max(mm.size[0],mm.size[2])*.5*sc;
    if(j&&blocked(x,zz,rad))continue;
    mm.spawn(x,zz,Math.random()*6.283,sc,tl());OBST.push({x,z:zz,r:d.edge?R0:rad})}
}
function updateProps(){updateArches();if(!sched.length||!PROPS.pebble)return;const lim=spawnAhead();
  while(sPtr<sched.length&&-itemZ(sched[sPtr])-camDist<lim){const it=sched[sPtr++];if(-itemZ(it)-camDist>-HM.back)spawnItem(it)}}
function resetProps(){for(const k in PROPS)for(const M of PROPS[k])if(M)M.clear();occClear();OBST.length=0;ARCH.placed={};
  if(!song)return;const t0=songTime()-(lookAhead()+HM.back)/speedMS();sPtr=0;while(sPtr<sched.length&&sched[sPtr].t<t0)sPtr++;updateProps()}
// a new song (or a replay) continues from where the last one stopped: keep every prop already standing, and let the
// new schedule fill only ground that hasn't been populated yet. The arch the walker stopped at becomes the start arch.
function continueProps(){if(!song)return;ARCH.placed={};const lim=spawnAhead();
  sPtr=0;while(sPtr<sched.length&&-itemZ(sched[sPtr])-camDist<lim)sPtr++;
  const za=archZ(0),A=PROPS.arch&&PROPS.arch[0];if(A&&A.live.some(r=>r&&Math.abs(r.z-za)<1.5))ARCH.placed[0]=true;
  updateProps()}
// a model list can have gaps while its files are still loading, so skip the gaps
function replaceProps(){for(const k in PROPS)for(const M of PROPS[k])if(M)M.replaceAll()}
// flatten the ground under each headstone so it sits in the earth
function gravePads(z,t,amp,rowH){
  for(const g of graves){const dz=-(g.t-t)*speedMS();if(Math.abs(dz)>PADR)continue;
    const zg=z+dz;if(g.hc===undefined||g.hcZ!==Math.round(zg*8)){const a=ampAt(g.t);g.x=graveX(g,zg);g.hc=a*((fbm(g.x*.07+100,zg*.07,3)*2-1)*1.5+(fbm(g.x*.21,zg*.21+50,2)*2-1)*.35);g.hcZ=Math.round(zg*8)}
    for(let k=0;k<HM.NX;k++){const x=HM.x0+k*HM.cell,dd=Math.hypot(x-g.x,dz);if(dd>PADR)continue;const w=1-sstep(PADR*.4,PADR,dd);rowH[k]=lerp(rowH[k],g.hc,w)}}
}

/* ---------------- placing flowers on screen ---------------- */
const _v=new THREE.Vector3(),_d=new THREE.Vector3();
function groundPoint(nx,ny){
  _v.set(nx,ny,.5).unproject(camera);_d.copy(_v).sub(camera.position).normalize();
  const c=camera.position;let y=c.y-S.alt,x=0,z=0;
  for(let i=0;i<4;i++){const t=(c.y-y)/Math.max(.05,-_d.y);x=c.x+_d.x*t;z=c.z+_d.z*t;y=hAt(x,z)}
  return {x,z};
}
function spot(r=.15){for(let i=0;i<10;i++){const p=groundPoint((Math.random()*2-1)*.9,lerp(-.7,.85,Math.random()));if(!blocked(p.x,p.z,r))return p}return null}
let evB=null,curLead=0;
const bassK=()=>.7+.8*(evB??gust);
// start growing early so each flower's glow peaks (at 90% of its grow time) exactly on its hit
const pk=k=>curLead-.9*K[k].def.grow;
const fsz=k=>lerp(K[k].def.h[0],K[k].def.h[1],Math.random())*S.fsize*bassK();
function cluster(k,n,rad){if(n<=0||!K[k])return;const c=spot();if(!c)return;rad*=S.fsize*bassK();
  for(let i=0;i<n;i++){const a=Math.random()*6.283,r=rad*Math.sqrt(Math.random()),x=c.x+Math.cos(a)*r,z=c.z+Math.sin(a)*r;if(blocked(x,z))continue;K[k].spawn(x,z,fsz(k),pk(k)+i*.025+Math.random()*.025)}}
let lastBig=-9;
function onEvent(e){
  if(S.density<=0||!K.lily)return;
  curLead=e.t-songTime();evB=envAt(song.an.bass,song.an.fr,e.t);try{onEvent2(e)}finally{evB=null;curLead=0}
}
function onEvent2(e){
  const E=envAt(song.an.env,song.an.fr,e.t);
  if(e.type!=='beat'&&Math.random()>.18+.95*E)return;
  const m=S.density*(.15+1.25*E*E);
  if(e.type==='beat'){if(e.down&&E>.35)for(let i=0;i<2;i++)if(Math.random()<.8*Math.min(1,S.density)){const p=spot(.25);if(p)K.phlox.spawn(p.x,p.z,fsz('phlox'),pk('phlox')+i*.06)}return}
  const s=e.s;
  if(e.b===0){if(s>.25&&clock-lastBig>.45/Math.max(.3,S.density)){const p=spot(.4);if(p){K.lily.spawn(p.x,p.z,fsz('lily')*(.85+.3*s),pk('lily'));lastBig=clock}}else cluster('spider',Math.round(s*m),.3)}
  else if(e.b===1){if(Math.random()<.35)cluster('hibiscus',Math.round(.5+s*1.2*m),.45);else cluster('geranium',Math.round(.6+s*2*m),.45)}
  else if(e.b===2)cluster('spider',Math.round(.6+s*2.2*m),.5);
  else if(Math.random()<.3)cluster(['dand1','dand2','dand3'][Math.random()*3|0],Math.round(.5+s*1.6*m),.4);
  else cluster('glory',Math.round(1+s*4*m),.3+.4*s);
}
function preseed(){camera.updateMatrixWorld();const g0=gust;gust=.35;
  for(let i=0;i<10;i++)cluster('glory',3,.3);
  for(let i=0;i<7;i++){cluster('geranium',1,.1);cluster('spider',1,.1)}
  for(let i=0;i<3;i++)cluster('phlox',1,.1);for(let i=0;i<2;i++)cluster('lily',1,.1);
  for(const k in K)for(let i=0;i<K[k].n;i++)K[k].aSpawn.array[i]-=30;GL.spawn.fill(-30,0,Math.min(GL.n,GN));glowDirty=true;gust=g0}

/* ---------------- loading every model up front ---------------- */
let modelsReady=false;
async function loadModels(onProg,onWarm=()=>{}){
  const loader=new GLTFLoader(),jobs=[];let done=0;
  // decode embedded textures through <img> rather than fetch(blob:), which the artifact sandbox may refuse
  loader.register(parser=>{parser.textureLoader=new THREE.TextureLoader(parser.options.manager);return {name:'img_textures'}});
  // each model ships as JSON holding the GLB bytes (base64), decoded here and parsed in memory
  const get=f=>fetch('models/'+f.replace(/\.glb$/,'.json')).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.json()})
    .then(j=>{const bin=atob(j.glb),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return loader.parseAsync(u.buffer,'')})
    .then(g=>{onProg(++done,total);return g});
  for(const k in FLOWER_DEFS)jobs.push(get(FLOWER_DEFS[k].file).then(g=>{K[k]=new FlowerKind(FLOWER_DEFS[k],g)}));
  for(const k in PROP_DEFS){PROPS[k]=[];PROP_DEFS[k].files.forEach((f,i)=>jobs.push(get(f).then(g=>{PROPS[k][i]=new PropModel(PROP_DEFS[k],g,i)})))}
  const tl=new THREE.TextureLoader(),tex=(f,srgb)=>tl.loadAsync('textures/'+f).then(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=renderer.capabilities.getMaxAnisotropy();if(srgb)t.colorSpace=THREE.SRGBColorSpace;onProg(++done,total);return t});
  jobs.push(tex('edge_col.webp',true).then(t=>{U.uPathCol.value=t}),tex('edge_nor.webp',false).then(t=>{U.uPathNor.value=t}),
    tex('center_col.webp',true).then(t=>{U.uCenCol.value=t}),tex('center_nor.webp',false).then(t=>{U.uCenNor.value=t}),
    tex('mud_col.webp',true).then(t=>{U.uMudCol.value=t}),tex('mud_nor.webp',false).then(t=>{U.uMudNor.value=t}));
  // the walking figure counts as one more job, so the loading bar covers it and its shaders get warmed up below
  jobs.push(runnerReady.then(()=>onProg(++done,total)));
  const total=jobs.length;await Promise.all(jobs);U.uPathOn.value=1;
  // warm up: compile every shader (including shadow passes) before the first real frame
  camera.updateMatrixWorld();const all=[...Object.values(K).flatMap(k=>k.meshes),...Object.values(PROPS).flat().flatMap(p=>p.meshes)];
  _m.compose(_p.set(0,-6,camera.position.z-lookAhead()),_q.identity(),_s.setScalar(.01));
  for(const m of all){_m.toArray(m.instanceMatrix.array,0);m.instanceMatrix.needsUpdate=true;m.count=1}
  // things hidden right now (fireflies, critters, the runner's parts) would otherwise build their shaders the first
  // time they show up mid-song, which stalls a frame, so show them for the warm-up and hide them again after
  const hidden=[];scene.traverse(o=>{if(!o.visible){hidden.push(o);o.visible=true}});
  // compileAsync has no progress callback, so the bar creeps toward 90% on a time curve and jumps to done at the end
  const w0=performance.now(),wi=setInterval(()=>onWarm(1-Math.exp(-(performance.now()-w0)/2500)),100);
  try{await renderer.compileAsync(scene,camera)}catch(e){}
  clearInterval(wi);onWarm(1);
  renderer.render(scene,camera);for(const m of all)m.count=0;for(const o of hidden)o.visible=false;
  modelsReady=true;
}

/* ---------------- audio analysis (runs in the browser) ---------------- */
function fft(re,im){const n=re.length;
  for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
  for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang),h=len>>1;
    for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let j=0;j<h;j++){const a=i+j,b=a+h,tr=re[b]*cr-im[b]*ci,ti=re[b]*ci+im[b]*cr;re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;const nc=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nc}}}}
const pct=(a,p)=>{const s=Float32Array.from(a).sort();return s[Math.min(s.length-1,Math.floor(p*s.length))]};
function localMean(a,W){const n=a.length,ps=new Float64Array(n+1);for(let i=0;i<n;i++)ps[i+1]=ps[i]+a[i];const o=new Float32Array(n);
  for(let i=0;i<n;i++){const lo=Math.max(0,i-W),hi=Math.min(n,i+W+1);o[i]=(ps[hi]-ps[lo])/(hi-lo)}return o}
const tick=()=>new Promise(r=>setTimeout(r,0));
async function analyze(buf,prog){
  const ch=buf.numberOfChannels,sr0=buf.sampleRate,dec=Math.max(1,Math.round(sr0/22050)),sr=sr0/dec,L=Math.floor(buf.length/dec);
  const x=new Float32Array(L),chans=[...Array(ch)].map((_,i)=>buf.getChannelData(i));
  for(let i=0;i<L;i++){let s=0;for(let c=0;c<ch;c++){const d=chans[c];for(let k=0;k<dec;k++)s+=d[i*dec+k]}x[i]=s/(ch*dec)}
  const N=1024,hop=512,fr=sr/hop,F=Math.max(8,Math.floor((L-N)/hop)+1);
  const win=new Float32Array(N).map((_,i)=>.5-.5*Math.cos(2*Math.PI*i/(N-1)));
  const bandHz=[[30,150],[150,600],[600,3000],[3000,11000]],bin=f=>clamp(Math.round(f*N/sr),1,N/2-1);
  const E=[0,1,2,3].map(()=>new Float32Array(F)),rms=new Float32Array(F),re=new Float32Array(N),im=new Float32Array(N);
  for(let f=0;f<F;f++){const o=f*hop;let ss=0;
    for(let i=0;i<N;i++){const v=x[o+i]||0;ss+=v*v;re[i]=v*win[i];im[i]=0}
    rms[f]=Math.sqrt(ss/N);fft(re,im);
    for(let b=0;b<4;b++){let s=0;for(let k=bin(bandHz[b][0]);k<=bin(bandHz[b][1]);k++)s+=re[k]*re[k]+im[k]*im[k];E[b][f]=Math.log1p(s*100)}
    if((f&511)===0){prog(f/F*.85);await tick()}}

  const OD=[],hits=[],minGap=[.12,.1,.09,.06],W=Math.round(fr*.5);
  for(let b=0;b<4;b++){const e=E[b],od=new Float32Array(F);
    for(let f=1;f<F;f++)od[f]=Math.max(0,e[f]-e[f-1]);
    const p=pct(od,.98)||1;for(let f=0;f<F;f++)od[f]=Math.min(1.5,od[f]/p);OD.push(od);
    const mean=localMean(od,W);let last=-1;
    for(let f=2;f<F-2;f++){const v=od[f];if(v<od[f-1]||v<od[f+1]||v<od[f-2]||v<od[f+2])continue;
      const thr=mean[f]*1.5+.2;if(v<thr)continue;const t=f/fr;if(t-last<minGap[b])continue;last=t;
      hits.push({t,type:'hit',b,s:clamp((v-thr)/Math.max(.2,1.2-thr)+.15,.1,1)})}}
  prog(.9);await tick();

  const env=new Float32Array(F);for(let f=0;f<F;f++)env[f]=OD[0][f]+OD[1][f]*.6+OD[2][f]*.9+OD[3][f]*.5;
  const em=localMean(env,W),e2=env.map((v,i)=>Math.max(0,v-em[i]));
  const lagMin=Math.floor(fr*60/180),lagMax=Math.ceil(fr*60/70),ac=new Float32Array(lagMax+3);
  for(let lag=lagMin-1;lag<=lagMax+1;lag++){let s=0;for(let f=0;f+lag<F;f++)s+=e2[f]*e2[f+lag];ac[lag]=s/Math.max(1,F-lag)}
  let best=-1,bl=lagMin;for(let lag=lagMin;lag<=lagMax;lag++){const bpm=60*fr/lag,w=Math.exp(-.5*Math.pow(Math.log2(bpm/120)/.9,2)),v=ac[lag]*w;if(v>best){best=v;bl=lag}}
  const a=ac[bl-1],b0=ac[bl],c=ac[bl+1],den=a-2*b0+c,lagF=bl+(den?clamp(.5*(a-c)/den,-.5,.5):0);
  const bpm=60*fr/lagF;
  let bp=0,bs=-1;for(let p=0;p<lagF;p+=.25){let s=0;for(let k=p;k<F;k+=lagF)s+=e2[Math.round(k)]||0;if(s>bs){bs=s;bp=p}}
  const bt=[];for(let k=bp;k<F;k+=lagF)bt.push(k/fr);
  let bd=0,bds=-1;for(let d=0;d<4;d++){let s=0;for(let i=d;i<bt.length;i+=4)s+=OD[0][Math.round(bt[i]*fr)]||0;if(s>bds){bds=s;bd=d}}
  const beats=bt.map((t,i)=>({t,type:'beat',down:((i-bd)%4+4)%4===0}));
  // loudness envelope (drives the hills) and bass envelope (drives gusts)
  const db=localMean(rms.map(v=>v*v),Math.round(fr*1.4)).map(v=>10*Math.log10(v+1e-10)),lo=pct(db,.05),hi=pct(db,.98);
  const loud=db.map(d=>clamp((d-lo)/Math.max(1,hi-lo),0,1));
  const bands=E.map(e=>{const lo=pct(e,.1),hi=pct(e,.98);return e.map(v=>clamp((v-lo)/Math.max(1e-3,hi-lo),0,1))}),bass=bands[0];
  prog(1);
  return {bpm,events:[...hits,...beats].sort((p,q)=>p.t-q.t),hitCount:hits.length,env:loud,bass,bands,fr,dur:buf.duration};
}

/* ---------------- demo track (synthesised offline) ----------------
   32 bars at 120 BPM: quiet intro, build, drop, breakdown, drop. */
async function makeDemo(){
  const sr=44100,spb=.5,bar=4*spb,bars=32,dur=bars*bar+1.5;
  const ctx=new OfflineAudioContext(2,Math.ceil(sr*dur),sr);
  const master=ctx.createGain();master.gain.value=.5;const comp=ctx.createDynamicsCompressor();master.connect(comp).connect(ctx.destination);
  const nb=ctx.createBuffer(1,sr*2,sr);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}

/* colour grading (fixed for release): shadows = lift, midtones = gamma, highlights = gain; [hue x, hue y, brightness] */
// fixed grade, read from the wheels as they were last set
const GRADE_DEF={lift:[-.41,.02,.02],gamma:[-.51,-.35,.53],gain:[.26,.51,.12]};
const CG=JSON.parse(JSON.stringify(GRADE_DEF)),gradeDraws=[];
function applyGrade(){const off=w=>{const r=Math.min(1,Math.hypot(w[0],w[1]));if(r<1e-4)return [0,0,0];const c=hsl2rgb(Math.atan2(w[1],w[0])*180/Math.PI,1,.5),m=(c[0]+c[1]+c[2])/3;return c.map(v=>(v-m)*r)};

  u.uLift.value.set(...L.map(v=>v*.12+CG.lift[2]*.08));
  u.uGamma.value.set(...M.map(v=>Math.max(.2,1+v*.4+CG.gamma[2]*.45)));
  u.uGain.value.set(...G.map(v=>Math.max(0,1+v*.6+CG.gain[2]*.6)))}
function resetGrade(){for(const k in CG)CG[k]=[...GRADE_DEF[k]];gradeDraws.forEach(f=>f());applyGrade()}

// roach: long oval abdomen, dark wing covers, domed head, six legs in a tripod gait; faces +x

    const lift=Math.max(0,Math.cos(p));j.fem.rotation.x=j.a1-.35*lift;j.knee.rotation.x=(j.a2-j.a1)+.4*lift}}}}
// centipede: twenty flattened segments, each with a pair of orange legs in a travelling wave; head leads (+x)

  c.g.visible=true;const z=c.z,ud=c.dir>0?u:1-u,x=pathX(z)+(2*ud-1)*(pathHW(z)+6),zz=z+Math.sin(u*Math.PI*3)*c.wob;

// roach: sprints toward us down the trail, runs past the camera, then cuts sideways into the grass

  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:FLY_TEX,color:new THREE.Color(.9,.85,.25),blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));halo.scale.setScalar(1);

/* the walker: an empty holder that keeps the figure (loaded below, before the loading screen lifts) on the trail
   with the camera. Faces -z (the direction of travel). */

  return {root,update(dt){const on=S.runner!==false;root.visible=on;if(!on)return;
    const z=-camDist-lookAhead()*.62,x=pathX(z)+.3*Math.sin(camDist*.1),dx=pathX(z-.5)-pathX(z+.5);

    if(go&&f.state!=='walk'){f.d0=f.off+f.r;f.tw=0;f.fade(f.walk,.35);f.walk.timeScale=0;f.state='walk'}
    // song ends or pauses: walk to a stop, then settle into the idle (see the 'finished' handler)
    else if(!go&&f.state==='walk'&&f.stop){f.fade(f.stop,.3);f.state='stop'}
    if(f.state==='walk'){const bpm=song?song.an.bpm:120,spb=bpm<65?2:bpm>145?.5:1,b=t*bpm/60*spb/2;f.walk.time=(b-Math.floor(b))*f.clip.duration}
    f.mixer.update(dt);
    // how far along the trail the animation alone puts her hips; her offset makes up the rest, so when she starts walking
    // her hips stay exactly where she stood through the crossfade, then ease into the walking spot
    f.r=f.hips?f.hold.worldToLocal(f.hips.getWorldPosition(f.hv)).z-f.obj.position.z:0;
    if(f.state==='walk'){f.tw+=dt;f.off=(f.d0-f.r)*Math.exp(-f.tw*.25)}
    f.obj.position.z=f.off}}
frame();
$('play').disabled=true;
let loadMsg='Loading models…',demoMsg='';
const showLoad=()=>status(modelsReady?(song?`${song.name} · ${Math.round(song.an.bpm)} BPM. Press ▶ to start, or load an MP3.`:demoMsg):`${loadMsg}${demoMsg?' · '+demoMsg:''}`);
// one honest bar: models 70%, demo track 15%, shader warm-up 15%
const P={m:0,d:0,w:0},vb=document.querySelector('#vbar i'),vsEl=document.getElementById('vsub');
const paint=()=>{const v=.7*P.m+.15*P.d+.15*P.w;if(vb)vb.style.width=(v*100).toFixed(1)+'%'};
const models=loadModels((d,n)=>{P.m=d/n;paint();loadMsg=`Loading models ${d}/${n}`;showLoad();if(vsEl)vsEl.textContent=`${d} / ${n}`},f=>{P.w=f;paint();if(vsEl&&P.m>=1)vsEl.textContent='Preparing the scene'}).catch(e=>{console.error(e);loadMsg="The models couldn't load. Reload the page to try again.";showLoad();throw e});
(async()=>{
  try{let buf=null,name='Demo track';
    try{demoMsg='loading the song';P.d=.05;paint();showLoad();const r=await fetch(START_SONG.file);
      if(r.ok){buf=await ensureCtx().decodeAudioData(await r.arrayBuffer());name=START_SONG.title}}catch(e){buf=null}
    if(!buf){demoMsg='building the demo track';P.d=.1;paint();showLoad();buf=await makeDemo()}
    P.d=.3;paint();
    const an=await analyze(buf,p=>{demoMsg=`analyzing the track ${Math.round(p*100)}%`;P.d=.3+.7*p;paint();showLoad()});
    if(!song){song={buf,an,name};buildSchedule(an.dur);regenAll();setInfo()}
  }catch(e){console.error(e);demoMsg='The demo track could not be built here. Load an MP3 to start.'}
  P.d=1;paint();
  try{await models}catch(e){return}
  P.m=P.w=1;paint();
  preseed();resetProps();$('play').disabled=false;$('hint').classList.remove('gone');showLoad();
})();
</script>
